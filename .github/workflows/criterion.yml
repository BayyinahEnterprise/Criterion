# Criterion — verify AI-generated content in CI
#
# Add this workflow to your repo, or copy the "Run Criterion" step
# into your existing workflow.
#
# Usage:
#   1. Create a pairs.jsonl file with your source-output pairs:
#      {"source": "...", "output": "..."}
#      {"source": "...", "output": "..."}
#
#   2. The action runs Criterion and fails if any pair is untrustworthy.
#      With no pairs file it passes with a notice.

name: Criterion Trust Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - rag
          - summary
          - strict

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find pairs file
        id: pairs
        run: |
          if [ -f criterion.jsonl ]; then echo "file=criterion.jsonl" >> "$GITHUB_OUTPUT"
          elif [ -f pairs.jsonl ]; then echo "file=pairs.jsonl" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No criterion.jsonl or pairs.jsonl in this repository; nothing to verify."
            echo 'Format: {"source": "...", "output": "..."} per line'
          fi

      - name: Install Criterion
        if: steps.pairs.outputs.file != ''
        # [all] includes the NLI model. Without it Criterion cannot detect
        # contradictions or fabricated claims, and refuses to return a verdict.
        # Inside the Criterion repository itself, install the checkout;
        # elsewhere, install the published package.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if grep -qs '^name = "criterion-ai"' pyproject.toml; then
            pip install ".[all]"
          else
            pip install "criterion-ai[all]"
          fi

      - name: Run Criterion
        if: steps.pairs.outputs.file != ''
        # Inputs reach the shell through env, never by ${{ }} interpolation
        # into the script. A missing NLI model is a hard error by default.
        # Tip: prefer an explicit mode. "auto" picks the lenient summary mode
        # whenever the output is short, and the output is what is under test.
        env:
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          PAIRS: ${{ steps.pairs.outputs.file }}
        run: criterion batch "$PAIRS" --mode "$MODE" --no-record -o results.jsonl

      - name: Check results
        if: steps.pairs.outputs.file != ''
        run: |
          python3 -c "
          import json, sys
          untrustworthy = 0
          with open('results.jsonl') as f:
              for line in f:
                  r = json.loads(line)
                  # Fail closed: an error row or a row without a verdict
                  # is not a trustworthy output.
                  if r.get('is_trustworthy') is not True:
                      untrustworthy += 1
                      print(f'✗ {r.get(\"trust_level\", \"error\")}: {r.get(\"summary\") or r.get(\"error\")}')
          if untrustworthy:
              print(f'\n{untrustworthy} untrustworthy output(s) found')
              sys.exit(1)
          print('✓ All outputs are trustworthy')
          "

      - name: Upload results
        if: always() && steps.pairs.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: results.jsonl
